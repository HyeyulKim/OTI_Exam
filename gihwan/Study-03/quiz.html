<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>데이터베이스 정규화 퀴즈</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="quiz-app">
    <section id="start-screen" class="start-screen" aria-labelledby="game-title">
      <p class="eyebrow">KNOWLEDGE PLAYGROUND</p>
      <h1 id="game-title">데이터베이스 정규화 퀴즈</h1>
      <p class="intro">정규화와 반정규화의 핵심 개념을 가볍게 확인해 보세요.</p>

      <div class="category-panel">
        <label for="category-select">퀴즈 카테고리</label>
        <select id="category-select" name="category">
          <option value="all">전체</option>
          <option value="1nf">1정규화</option>
          <option value="2nf">2정규화</option>
          <option value="3nf">3정규화</option>
          <option value="denormalization">반정규화</option>
        </select>
      </div>

      <button type="button" id="start-button" class="start-button">퀴즈 시작하기</button>

      <section class="ranking-section start-ranking-section" aria-labelledby="start-ranking-title">
        <div class="ranking-heading">
          <h2 id="start-ranking-title">랭킹</h2>
          <span id="start-ranking-count"></span>
        </div>
        <ol id="start-ranking-list" class="ranking-list"></ol>
      </section>
    </section>

    <section id="quiz-screen" class="quiz-screen" aria-labelledby="question-title" hidden>
      <div class="quiz-header">
        <span class="quiz-category" id="quiz-category"></span>
        <strong class="quiz-progress" id="quiz-progress"></strong>
      </div>

      <div class="question-card">
        <p class="question-number" id="question-number"></p>
        <h2 id="question-title"></h2>
        <div id="options-list" class="options-list" role="group" aria-label="보기"></div>
      </div>

      <div id="feedback" class="feedback" aria-live="polite" hidden>
        <strong id="feedback-title"></strong>
        <p id="feedback-explanation"></p>
      </div>

      <button type="button" id="next-button" class="next-button" disabled>다음 문제</button>
    </section>

    <section id="result-screen" class="result-screen" aria-labelledby="result-title" hidden>
      <p class="eyebrow">QUIZ COMPLETE</p>
      <h2 id="result-title">퀴즈 결과</h2>

      <div class="score-card">
        <span>총점</span>
        <strong id="total-score"></strong>
      </div>

      <section class="category-results" aria-labelledby="category-results-title">
        <h3 id="category-results-title">카테고리별 정답</h3>
        <div id="category-results-list" class="category-results-list"></div>
      </section>

      <form id="record-form" class="record-form">
        <label for="nickname-input">랭킹에 기록할 닉네임</label>
        <div class="record-entry">
          <input id="nickname-input" name="nickname" type="text" maxlength="20" placeholder="닉네임 입력" required>
          <button type="submit" class="save-button">기록하기</button>
        </div>
        <p id="record-status" class="record-status" role="status"></p>
      </form>

      <section class="ranking-section" aria-labelledby="ranking-title">
        <div class="ranking-heading">
          <h3 id="ranking-title">랭킹</h3>
          <span id="ranking-count"></span>
        </div>
        <ol id="ranking-list" class="ranking-list"></ol>
      </section>

      <button type="button" id="restart-button" class="restart-button">다시 하기</button>
    </section>
  </main>

  <script src="data/questions.js"></script>
  <script src="script.js"></script>
</body>
</html>
