<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>OTI_Exam</title>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: "Segoe UI", "Malgun Gothic", sans-serif;
      background: #f4f5f7;
      color: #1f2430;
    }

    .card {
      width: 100%;
      max-width: 480px;
      background: #ffffff;
      border-radius: 16px;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.08);
      padding: 40px 32px;
    }

    h1 {
      margin: 0 0 8px;
      font-size: 24px;
      text-align: center;
    }

    p.subtitle {
      margin: 0 0 28px;
      text-align: center;
      color: #6b7280;
      font-size: 14px;
    }

    ul.links {
      list-style: none;
      margin: 0;
      padding: 0;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    ul.links li a {
      display: block;
      padding: 14px 18px;
      border-radius: 10px;
      background: #f8f9fb;
      border: 1px solid #e5e7eb;
      color: #1f2430;
      text-decoration: none;
      font-size: 16px;
      font-weight: 500;
      transition: background 0.15s ease, border-color 0.15s ease;
    }

    ul.links li a:hover {
      background: #eef1ff;
      border-color: #c7d2fe;
    }
  </style>
